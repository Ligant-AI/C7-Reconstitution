name = "ligant-reconstitution-router"
main = "src/index.js"
compatibility_date = "2026-09-29"

# Path-based routing on the live zone, as for the sibling tools: the
# Reconstitution tool is its own Pages project (ligant-reconstitution), and this
# Worker intercepts only benchtools.ligant.ai/reconstitution; everything else on
# the domain falls through untouched. Both patterns are needed because a route
# pattern's "*" does not imply the exact, slash-less path.
routes = [
  { pattern = "benchtools.ligant.ai/reconstitution", zone_name = "ligant.ai" },
  { pattern = "benchtools.ligant.ai/reconstitution/*", zone_name = "ligant.ai" },
]
